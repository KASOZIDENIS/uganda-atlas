name: Editathon leaderboard

# Every 10 minutes: recompute the leaderboard. About once an hour: re-check which task-list items now have
# their image (metrics.json). Both files are published on their own branch (editathon-data), so the website
# is not rebuilt each time. GitHub may delay scheduled runs by several minutes; the page also refreshes
# itself live in the visitor's browser.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the previous results
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/editathon-data/metrics.json" -o "$RUNNER_TEMP/out/metrics.json" || rm -f "$RUNNER_TEMP/out/metrics.json"
          for f in luganda-state.json luganda-live.json; do
            curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/editathon-data/$f" -o "$RUNNER_TEMP/out/$f" || rm -f "$RUNNER_TEMP/out/$f"
          done
      - name: Compute the leaderboard
        run: node scripts/leaderboard.mjs "$RUNNER_TEMP/out/leaderboard.json"
      - name: Re-check the task lists (hourly)
        run: |
          if [ ! -f "$RUNNER_TEMP/out/metrics.json" ] || [ "$(date -u +%M)" -lt 10 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/metrics.mjs "$RUNNER_TEMP/out/metrics.json"
          else
            echo "metrics are recent; skipping"
          fi
      - name: Live Luganda Wikipedia numbers (hourly)
        # Same filter as the September snapshot; only measures what changed since the last run. If it fails, the previous
        # luganda-live.json is kept and the page falls back to it (or to the snapshot).
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if [ ! -f "$RUNNER_TEMP/out/luganda-live.json" ] || [ "$(date -u +%M)" -lt 10 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/live_luganda.mjs "$RUNNER_TEMP/out"
          else
            echo "Luganda numbers are recent; skipping"
          fi
      - name: Publish on the editathon-data branch
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b editathon-data
          git config user.name  "editathon-bot"
          git config user.email "editathon-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Editathon data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" editathon-data
