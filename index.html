/*FONTS*/
/* Layout: cinematic dark stage; sticky tab rail; each tab is a "reel" with a play control that animates its data through time. */
:root{
  --bg:#101418; --panel:#16191d; --raise:#202122; --line:#2e3135; --mute:#72777d; --soft:#a2a9b1; --fg:#eaecf0; --white:#f8f9fa;
  --red:#990000; --green:#339966; --blue:#006699;
  --red-t:#c27a7a; --green-t:#70b894; --blue-t:#4d94b8; --blue-l:#80b3cc;
  --f-display:"Crimson Pro", "Linux Libertine", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:clamp(26px,3.2vw,38px);line-height:1.1}
h3{font-size:21px;line-height:1.2}
p{margin:0}
.lede{color:var(--soft);max-width:68ch}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--blue-l);outline-offset:2px}

/* HERO */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(1200px 500px at 75% 40%, rgba(0,102,153,.22), transparent 60%), radial-gradient(700px 400px at 10% 90%, rgba(51,153,102,.12), transparent 60%), var(--bg)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-inner{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;padding-block:40px 34px;min-height:440px;align-items:center}
.brand{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.brand img{width:58px;height:auto;animation:spinIn 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.hero h1{font-size:clamp(40px,6vw,76px);line-height:.98;letter-spacing:-.01em}
.hero h1 em{font-style:italic;font-weight:400;color:var(--green-t)}
.hero .sub{margin-top:16px;font-size:18px;color:var(--soft);max-width:46ch}
.legend-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:22px;font-size:13px;color:var(--soft)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.hero-count{margin-top:18px;font-family:var(--f-data);font-size:13px;color:var(--soft)}
.hero-count b{color:var(--fg);font-size:22px;font-weight:500}

/* TABS */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,20,24,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:12px;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:14px 12px 12px;color:var(--soft);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px;font-weight:600}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--c,var(--blue))}
.tourbtn{flex:none;display:flex;align-items:center;gap:8px;background:var(--red);border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.tourbtn:hover{filter:brightness(1.15)}
.tourbtn svg{width:12px;height:12px;flex:none}.tourbtn span{white-space:nowrap}
#selSub{width:260px;max-width:100%}

/* SECTIONS */
section.reel{padding-block:34px 60px}
section.reel[hidden]{display:none}
.reel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.reel-head>div{min-width:0;max-width:760px}
.reel-head p{margin-top:8px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 18px 14px;min-width:0}
.card h3{margin-bottom:4px}
.card .cap{font-size:13px;color:var(--soft);margin-bottom:10px}
.note{font-size:12.5px;color:var(--mute);margin-top:10px;max-width:90ch}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--soft);font-family:var(--f-body);font-size:12px}
svg .val{font-family:var(--f-data);fill:var(--fg);font-size:11.5px}
svg .lbl{fill:var(--fg)}
svg .axis line,svg .axis path{stroke:var(--line)}
svg .axis text{fill:var(--mute);font-family:var(--f-data);font-size:10.5px}
svg .grid line{stroke:var(--line);stroke-dasharray:2 3}

/* controls */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--soft);font-weight:600}
.btn:hover{color:var(--fg);border-color:var(--mute)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--blue);border:0;border-radius:999px;padding:8px 16px 8px 12px;font-weight:700;font-size:13.5px;cursor:pointer}
.play:hover{filter:brightness(1.18)}
.play svg{width:14px;height:14px}
select,input[type=search],input[type=text]{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-family:var(--f-data);min-width:0}
input[type=range]{accent-color:var(--green);width:100%}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel);padding:16px 16px 14px;min-width:0}
.kpi .k{font-family:var(--f-data);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft)}
.kpi .v{font-family:var(--f-display);font-size:clamp(30px,3.4vw,44px);font-weight:600;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--mute)}
.kpi .bar{height:3px;background:var(--raise);margin-top:10px;border-radius:2px;overflow:hidden}
.kpi .bar i{display:block;height:100%;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.summary{font-family:var(--f-display);font-size:21px;line-height:1.35;margin:18px 0 22px;max-width:80ch;color:var(--fg)}
.summary b{font-weight:600;color:var(--green-t)}

/* tables */
.tbl-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--raise);font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);cursor:pointer;z-index:1}
td.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(0,102,153,.12)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--soft)}

/* time-lapse */
.yearbig{font-family:var(--f-display);font-size:clamp(60px,9vw,120px);line-height:.9;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.ticker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.ticker div{border-left:3px solid var(--c);padding-left:10px;min-width:0}
.ticker .v{font-family:var(--f-data);font-size:20px;font-variant-numeric:tabular-nums}
.ticker .k{font-size:12px;color:var(--soft)}
canvas.full{width:100%;display:block}

.tip{position:fixed;pointer-events:none;z-index:50;background:var(--raise);border:1px solid var(--mute);border-radius:6px;padding:8px 10px;font-size:12.5px;max-width:300px;opacity:0;transition:opacity .12s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tip b{font-family:var(--f-display);font-size:16px;font-weight:600;display:block;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--soft)}
.tip .r span:last-child{color:var(--fg);font-family:var(--f-data)}

.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;margin-bottom:8px}
.crumbs button{background:none;border:0;color:var(--blue-l);cursor:pointer;padding:0;font-weight:600}
.crumbs span{color:var(--mute)}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;font-size:13px}
.info dt{color:var(--soft)} .info dd{margin:0;font-family:var(--f-data);text-align:right}

.method-text{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 30px;margin-top:22px}
.method-text h3{font-size:19px;margin-bottom:6px;color:var(--fg)}
.method-text p{color:var(--soft);font-size:14px}

/* caption overlay for tour/film */
.caption{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:rgba(16,20,24,.94);border:1px solid var(--line);border-left:4px solid var(--red);padding:12px 20px;border-radius:6px;opacity:0;transition:all .5s;max-width:min(760px,calc(100vw - 32px))}
.caption.on{opacity:1;transform:translate(-50%,0)}
.caption .t{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.15}
.caption .s{color:var(--soft);font-size:14px;margin-top:2px}
.curtain{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s;padding:24px}
.curtain.on{opacity:1}
.curtain img{width:140px}
.curtain h1{font-size:clamp(40px,6vw,80px)}
.curtain p{color:var(--soft);font-size:20px}
.stopbar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));z-index:80}

.search-res{position:absolute;left:0;right:0;top:100%;background:var(--raise);border:1px solid var(--line);border-radius:6px;z-index:30;max-height:300px;overflow:auto}
.search-res button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;cursor:pointer;font-size:13.5px}
.search-res button:hover{background:rgba(0,102,153,.25)}

@media (max-width:900px){
  .hero-inner{grid-template-columns:1fr;min-height:0;padding-block:28px}
  .hero-inner .spacer{height:260px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .method-text{grid-template-columns:1fr}
}
@media (max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .ticker{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tourbtn span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.prog{height:3px;background:var(--raise);border-radius:2px;overflow:hidden;margin:6px 0 12px}.prog i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.colbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;margin-top:8px;max-height:220px;overflow:auto}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--soft)}
.xtbl{max-height:640px}
.xchart .ctrl{margin-bottom:8px}
.pager select{padding:5px 8px;font-size:13px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--mute);z-index:90;overflow:auto;padding:18px;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.drawer[hidden]{display:none}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.drawer dl{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:6px 12px;font-size:13px;margin:14px 0 0}
.drawer dt{color:var(--soft)}.drawer dd{margin:0;font-family:var(--f-data);word-break:break-word}
.dlink{font-size:13px;font-weight:600}
.dspark{margin:6px 0 4px}
/* insights */
.insights{margin-top:18px}
.icard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;padding:16px 18px 18px;min-width:0}
.ihead{display:flex;gap:10px;align-items:baseline}
.inum{font-family:var(--f-data);font-size:11px;color:var(--c);filter:brightness(1.5)}
.icard h3{font-size:19px}
.istat{font-family:var(--f-display);font-size:clamp(34px,4vw,50px);font-weight:600;line-height:1.05;margin:10px 0 8px;color:var(--fg);overflow-wrap:anywhere}
.icard p{color:var(--soft);font-size:14px}
/* english overview picker */
.pickcard .picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:16px;align-items:end}
.rel{position:relative}
.subin{width:100%}
.search-res{position:absolute;left:0;right:0;top:100%;background:var(--raise);border:1px solid var(--line);border-radius:6px;z-index:30;max-height:300px;overflow:auto}
.search-res button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:7px 10px;cursor:pointer;font-size:13.5px}
.search-res button:hover{background:rgba(0,102,153,.25)}.rc{color:var(--mute);font-family:var(--f-data)}
.eng .summary{margin-top:18px}
/* palette */
.palette{position:fixed;inset:0;z-index:100;background:rgba(10,12,15,.8);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0}
.pbox{width:min(720px,100%)}
/* about, nav */
.about{padding-block:30px 60px}.asec{margin-bottom:42px}.asec h2{margin-bottom:14px}.asec>p{color:var(--soft);margin-bottom:14px;max-width:80ch}
.asec .card p,.asec .card .cap{color:var(--soft);font-size:14px}
.dnext{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-block:20px 60px}
.pn{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;color:var(--fg)}
.pn:hover{border-color:var(--mute)}.pn span{font-family:var(--f-data);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pn.r{text-align:right}.pn.mid{text-align:center}
.loading{padding:60px 0;color:var(--soft)}
.sitefoot{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mute);font-size:12.5px}
.sitefoot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.list .dcard{grid-template-columns:1fr 1fr}.pickcard .picker{grid-template-columns:1fr}}
@media (max-width:720px){.cards{grid-template-columns:1fr}.blocks{grid-template-columns:1fr}.dnext{grid-template-columns:1fr}.donut{grid-template-columns:1fr}.dmini{display:none}.hero.hub .hero-inner{min-height:0}.searchrow{margin-top:-10px}.cards.list .dcard{grid-template-columns:1fr}.topbar a.tl{display:none}.sbtn span.t{display:none}}

.kpis.k6,.kpis.k3,.kpis.k9{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}@media (max-width:900px){.kpis.k6,.kpis.k3,.kpis.k9,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}}

.vizbox>svg{max-width:980px}

function route(){
  const hash=location.hash.replace(/^#/,'');
  if(!hash||hash==='home'){CURRENT=null;leave();const a=app();a.innerHTML='';window.scrollTo(0,0);renderHub(a);return}
  if(hash==='about'){CURRENT=null;renderAbout();return}
  const [id,tab]=hash.split('.');renderDash(id,tab);
}
async function boot(){
  const a=app();
  try{[MAN,SI]=await Promise.all([getJSON('d/manifest.json'),getJSON('d/search.json')])}catch(e){a.innerHTML='<div class="wrap loading">Could not load the atlas data.</div>';console.error(e);return}
  $('#openSearch').onclick=openPalette;
  document.addEventListener('keydown',e=>{if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&(e.key==='/'||(e.key==='k'&&(e.metaKey||e.ctrlKey)))&&location.hash&&location.hash!=='#home'){e.preventDefault();openPalette()}});
  addEventListener('hashchange',route);route();
}
document.addEventListener('DOMContentLoaded',boot);

</script>
</body></html>
